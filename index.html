<form action="https://formspree.io/f/xknabpze" method="POST">
<div class="form-group">
<label for="name">Navn</label>
<input type="text" id="name" name="name" required placeholder="Ditt navn">
</div>
<div class="form-group">
<label for="email">E-post</label>
<input type="email" id="email" name="email" required placeholder="din@epost.no">
</div>
<div class="form-group">
<label for="message">Melding</label>
<textarea id="message" name="message" rows="5" required placeholder="Hva kan jeg hjelpe deg med?"></textarea>
</div>
<button type="submit" class="cta-button" style="width: 100%; border: none; cursor: pointer;">Send melding</button>
</form>
